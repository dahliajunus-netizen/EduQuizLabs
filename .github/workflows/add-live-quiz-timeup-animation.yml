name: Add Live Quiz Time Up Animation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[time-up-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch student live quiz
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/student/live-quiz/[code]/page.tsx')
          s = p.read_text()
          original = s

          # Add state once.
          old = "[loadingTimedOut,setLoadingTimedOut]=useState(false)"
          new = "[loadingTimedOut,setLoadingTimedOut]=useState(false),[timeUp,setTimeUp]=useState(false)"
          if old in s and '[timeUp,setTimeUp]' not in s:
              s = s.replace(old, new, 1)

          # Reset timeout animation whenever the question changes.
          marker = "setResponseTime(null);setSubmitting(false);setRemaining(q.time_limit_seconds||30)"
          if marker in s and 'setTimeUp(false)' not in s:
              s = s.replace(marker, "setResponseTime(null);setSubmitting(false);setTimeUp(false);setRemaining(q.time_limit_seconds||30)", 1)

          # Trigger the animation exactly when the local timer reaches zero with no answer.
          timer_end = "},[answering,quiz?.question_started_at,q?.id,q?.time_limit_seconds]);"
          effect = "useEffect(()=>{if(answering&&q&&remaining<=0&&!answered)setTimeUp(true)},[answering,q?.id,remaining,answered]);"
          if effect not in s and timer_end in s:
              s = s.replace(timer_end, timer_end + effect, 1)

          # Add an accessible animated overlay at the top of the quiz page.
          if 'TIME’S UP!' not in s and 'TIME\'S UP!' not in s:
              import re
              pat = r"return (<main\s+[^>]*>)"
              m = re.search(pat, s)
              if m:
                  overlay = '''{timeUp&&<div className="pointer-events-none fixed inset-0 z-[100] flex items-center justify-center bg-red-950/20 px-4 backdrop-blur-[2px] animate-in fade-in duration-200"><div role="alert" className="w-full max-w-sm rounded-3xl border-2 border-red-500/30 bg-card p-8 text-center shadow-2xl animate-in zoom-in-90 duration-300"><div className="mx-auto mb-4 flex size-20 items-center justify-center rounded-full bg-red-500/15 text-red-600 animate-pulse"><Clock className="size-10"/></div><h2 className="text-3xl font-black tracking-tight text-red-600">TIME’S UP!</h2><p className="mt-2 text-sm font-medium text-muted-foreground">No answer selected</p></div></div>}'''
                  s = s[:m.end()] + overlay + s[m.end():]

          if s == original:
              raise SystemExit('No applicable patch points found; refusing to commit.')
          if 'timeUp' not in s or 'TIME’S UP!' not in s:
              raise SystemExit('Patch incomplete; refusing to commit.')
          p.write_text(s)
          PY
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git diff -- app/dashboard/student/live-quiz/[code]/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/student/live-quiz/[code]/page.tsx
          git commit -m "feat: animate live quiz timeout [time-up-patch]"
          git push
          git rm .github/workflows/add-live-quiz-timeup-animation.yml
          git commit -m "chore: remove live quiz timeout patch workflow [time-up-patch]"
          git push

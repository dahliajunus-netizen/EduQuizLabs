name: Adjust live quiz waiting room
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/adjust-live-quiz-waiting-room.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch waiting room sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/teacher/live-quiz/page.tsx')
          s=p.read_text()
          old='''<div className="mx-auto mt-7 flex flex-col items-center gap-5 sm:flex-row">\n  <div className="rounded-3xl border bg-white p-4 shadow-lg"><QRCodeSVG value={joinUrl||'https://eduquizlabs.com/join'} size={220}/></div>\n  <div className="flex min-w-[220px] flex-col items-center rounded-3xl border bg-card px-8 py-7 shadow-lg">'''
          new='''<div className="mx-auto mt-7 flex flex-col items-center gap-5 sm:flex-row">\n  <div className="rounded-3xl border bg-white p-4 shadow-lg"><QRCodeSVG value={joinUrl||'https://eduquizlabs.com/join'} size={220}/></div>\n  <div className="flex size-[252px] flex-col items-center justify-center rounded-3xl border bg-card px-6 py-7 shadow-lg">'''
          if old in s: s=s.replace(old,new)
          old2='''<a href="/join" className="text-sm font-bold text-primary hover:underline">eduquizlabs.vercel.app/join</a>'''
          new2='''<a href="/join" className="mt-1 text-lg font-black tracking-tight text-primary hover:underline sm:text-xl">eduquizlabs.vercel.app/join</a>'''
          if old2 in s: s=s.replace(old2,new2)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/dashboard/teacher/live-quiz/page.tsx
          git diff --cached --quiet || git commit -m "adjust live quiz code and join URL sizing"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/adjust-live-quiz-waiting-room.yml
          git commit -m "remove temporary live quiz workflow"
          git push

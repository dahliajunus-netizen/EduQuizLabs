name: Apply Live Quiz UI fixes

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Patch Live Quiz UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          student = Path('app/dashboard/student/live-quiz/[code]/page.tsx')
          s = student.read_text()
          if '{p.score} pts' in s:
              s = s.replace('<span className="text-sm font-black">{p.score} pts</span>', '<div className="flex items-center gap-3 text-right"><div><p className="text-[10px] font-bold uppercase tracking-wider text-muted-foreground">Correct</p><p className="text-sm font-black">{p.correct_answers}</p></div><div><p className="text-[10px] font-bold uppercase tracking-wider text-muted-foreground">Time</p><p className="text-sm font-black tabular-nums">{p.total_response_time_ms > 0 ? `${(p.total_response_time_ms / 1000).toFixed(2)}s` : "—"}</p></div></div>', 1)
          if 'min-h-[30vh] max-h-80 flex-col' in s:
              s = s.replace('min-h-[30vh] max-h-80 flex-col', 'min-h-[34vh] sm:min-h-[36vh] max-h-none flex-col', 1)
          student.write_text(s)

          teacher = Path('app/dashboard/teacher/live-quiz/page.tsx')
          t = teacher.read_text()
          if 'async function endQuizNow()' not in t:
              pattern = r'const\s+progress\s*=\s*Math\.max\(0,\s*Math\.min\(100,\s*\(remaining/30\)\*100\)\)\s*;'
              replacement = '''async function endQuizNow() {
    if (!quiz) return;
    if (!window.confirm('End this live quiz now? Players will see the final leaderboard.')) return;
    try {
      const rows = await api(`live_quizzes?id=eq.${encodeURIComponent(quiz.id)}`, { method: 'PATCH', headers: { ...headers, Prefer: 'return=representation' }, body: JSON.stringify({ status: 'finished', question_started_at: null }) });
      setQuiz(rows?.[0] || { ...quiz, status: 'finished', question_started_at: null });
      setAnsweredCount(0);
    } catch (e) { setError(e instanceof Error ? e.message : 'Could not end the quiz.'); }
  }
  const progress=Math.max(0,Math.min(100,(remaining/30)*100));'''
              t, count = re.subn(pattern, replacement, t, count=1)
              if count != 1:
                  raise SystemExit('teacher progress marker not found')
          if 'onClick={endQuizNow}' not in t:
              pos = t.rfind('</main>;')
              if pos < 0:
                  raise SystemExit('teacher final main marker not found')
              button = '<div className="fixed bottom-5 right-5 z-50"><button type="button" onClick={endQuizNow} className="rounded-xl border border-destructive bg-background px-4 py-2.5 text-sm font-black text-destructive shadow-lg transition hover:bg-destructive hover:text-destructive-foreground">End Quiz</button></div>'
              t = t[:pos] + button + t[pos:]
          teacher.write_text(t)
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/student/live-quiz/'[code]'/page.tsx app/dashboard/teacher/live-quiz/page.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: improve live quiz results and controls'
          git push origin main
          git rm .github/workflows/apply-live-quiz-ui-fixes.yml
          git commit -m 'chore: remove temporary live quiz patch workflow'
          git push origin main

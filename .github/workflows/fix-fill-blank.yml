name: Fix fill in the blank questions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix fill in the blank answer persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/dashboard/student/classes/[code]/page.tsx')
          s = p.read_text()

          old_validation = "if (questionForm.questionType === 'fill-blank' && !questionForm.correctAnswer.trim()) { setMessage('Enter the correct answer.'); return; }"
          new_validation = "if (questionForm.questionType === 'fill-blank' && !questionForm.optionA.trim()) { setMessage('Enter the correct answer.'); return; }"
          if old_validation not in s:
              raise SystemExit('fill-blank validation pattern not found')
          s = s.replace(old_validation, new_validation, 1)

          old_payload = "option_a: questionForm.questionType === 'true-false' ? 'True' : questionForm.questionType === 'fill-blank' ? questionForm.correctAnswer.trim() : questionForm.optionA.trim(), option_b: questionForm.questionType === 'true-false' ? 'False' : questionForm.optionB.trim(), option_c: questionForm.questionType === 'multiple-choice' ? questionForm.optionC.trim() : '', option_d: questionForm.questionType === 'multiple-choice' ? questionForm.optionD.trim() : '', correct_answer: questionForm.correctAnswer.trim(),"
          new_payload = "option_a: questionForm.questionType === 'true-false' ? 'True' : questionForm.questionType === 'fill-blank' ? questionForm.optionA.trim() : questionForm.optionA.trim(), option_b: questionForm.questionType === 'true-false' ? 'False' : questionForm.optionB.trim(), option_c: questionForm.questionType === 'multiple-choice' ? questionForm.optionC.trim() : '', option_d: questionForm.questionType === 'multiple-choice' ? questionForm.optionD.trim() : '', correct_answer: questionForm.questionType === 'fill-blank' ? questionForm.optionA.trim() : questionForm.correctAnswer.trim(),"
          if old_payload not in s:
              raise SystemExit('fill-blank payload pattern not found')
          s = s.replace(old_payload, new_payload, 1)

          p.write_text(s)
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-fill-blank.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/student/classes/[code]/page.tsx .github/workflows/fix-fill-blank.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: save fill in the blank answers correctly'
          git push

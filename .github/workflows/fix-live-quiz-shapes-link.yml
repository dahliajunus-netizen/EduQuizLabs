name: Fix live quiz shapes and join link

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-live-quiz-shapes-link.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch live quiz UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          teacher = Path('app/dashboard/teacher/live-quiz/page.tsx')
          s = teacher.read_text()
          old = "const base=size==='lg'?'size-20 sm:size-24':size==='sm'?'size-9':'size-14 sm:size-16';const shape=opt.shape==='triangle'?'[clip-path:polygon(50%_0%,100%_100%,0%_100%)]':opt.shape==='diamond'?'rotate-45 rounded-[5px]':opt.shape==='circle'?'rounded-full':'rounded-[5px]';"
          new = "const base=size==='lg'?(opt.shape==='diamond'?'size-14 sm:size-20':'size-20 sm:size-24'):size==='sm'?'size-9':(opt.shape==='diamond'?'size-10 sm:size-12':'size-14 sm:size-16');const shape=opt.shape==='triangle'?'[clip-path:polygon(50%_0%,100%_100%,0%_100%)]':opt.shape==='diamond'?'rotate-45 rounded-[5px]':opt.shape==='circle'?'rounded-full':'rounded-[5px]';"
          if old not in s:
              raise SystemExit('teacher Shape pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('<div className="mx-auto mb-5 flex size-16 items-center justify-center rounded-3xl bg-primary text-primary-foreground shadow-lg translate-y-3"><Users className="size-8"/></div><p className="translate-y-3 text-xs font-black uppercase tracking-[.25em] text-primary">Waiting room</p>', '<div className="mx-auto mb-5 flex size-16 items-center justify-center rounded-3xl bg-primary text-primary-foreground shadow-lg"><Users className="size-8"/></div><p className="text-xs font-black uppercase tracking-[.25em] text-primary">Waiting room</p>', 1)
          s = s.replace('<div className="mx-auto mt-7 flex flex-col items-center gap-5 sm:flex-row"><div className="rounded-3xl border bg-white p-4 shadow-lg"><QRCodeSVG value={joinUrl||\'https://eduquizlabs.com/join\'} size={210} bgColor="#ffffff" fgColor="#111827" level="H" includeMargin/></div><div className="flex min-w-[220px] flex-col justify-center rounded-3xl border bg-background px-5 py-4 text-left shadow-lg"><p className="text-[10px] font-black uppercase tracking-[.3em] text-muted-foreground">Game code</p><p className="mt-1 font-mono text-4xl font-black tracking-[.22em]">{quiz.game_code}</p><Button variant="outline" onClick={()=>{void navigator.clipboard?.writeText(quiz.game_code||\'\');setCopied(true);window.setTimeout(()=>setCopied(false),1400)}} className="mt-4 rounded-xl font-bold">{copied?<Check className="mr-2 size-4"/>:<Copy className="mr-2 size-4"/>}{copied?\'Copied\':\'Copy code\'}</Button></div></div>', '<div className="mx-auto mt-7 flex flex-col items-center gap-5"><div className="flex flex-col items-center gap-5 sm:flex-row"><div className="rounded-3xl border bg-white p-4 shadow-lg"><QRCodeSVG value={joinUrl||\'https://eduquizlabs.com/join\'} size={210} bgColor="#ffffff" fgColor="#111827" level="H" includeMargin/></div><div className="flex min-w-[220px] flex-col justify-center rounded-3xl border bg-background px-5 py-4 text-left shadow-lg"><p className="text-[10px] font-black uppercase tracking-[.3em] text-muted-foreground">Game code</p><p className="mt-1 font-mono text-4xl font-black tracking-[.22em]">{quiz.game_code}</p><Button variant="outline" onClick={()=>{void navigator.clipboard?.writeText(quiz.game_code||\'\');setCopied(true);window.setTimeout(()=>setCopied(false),1400)}} className="mt-4 rounded-xl font-bold">{copied?<Check className="mr-2 size-4"/>:<Copy className="mr-2 size-4"/>}{copied?\'Copied\':\'Copy code\'}</Button></div></div><a href="/join" className="text-sm font-bold text-primary hover:underline">eduquizlabs.vercel.app/join</a></div>', 1)
          s = s.replace('<span className="translate-y-2 rounded-full bg-primary/10 px-3 py-1.5 text-[10px] font-black uppercase tracking-wider text-primary">{isReveal?\'Question reveal\':isAnswering?\'Answering now\':\'Results\'}</span>', '<span className="rounded-full bg-primary/10 px-3 py-1.5 text-[10px] font-black uppercase tracking-wider text-primary">{isReveal?\'Question reveal\':isAnswering?\'Answering now\':\'Results\'}</span>', 1)
          teacher.write_text(s)

          student = Path('app/dashboard/student/live-quiz/[code]/page.tsx')
          s = student.read_text()
          old = "function Shape({type}:{type:string}){return <span className=\"flex size-24 items-center justify-center sm:size-32\"><span className={`block size-20 sm:size-28 ${type==='triangle'?'[clip-path:polygon(50%_0%,100%_100%,0%_100%)':type==='diamond'?'rotate-45 rounded-lg':type==='circle'?'rounded-full':'rounded-lg'} bg-white shadow-md`}/></span>}"
          new = "function Shape({type}:{type:string}){const base=type==='diamond'?'size-14 sm:size-20':'size-20 sm:size-28';return <span className=\"flex size-24 items-center justify-center sm:size-32\"><span className={`block ${base} ${type==='triangle'?'[clip-path:polygon(50%_0%,100%_100%,0%_100%)]':type==='diamond'?'rotate-45 rounded-lg':type==='circle'?'rounded-full':'rounded-lg'} bg-white shadow-md`}/></span>}"
          if old not in s:
              raise SystemExit('student Shape pattern not found')
          s = s.replace(old, new, 1)
          student.write_text(s)
          PY

          git diff --check
          git diff -- app/dashboard/teacher/live-quiz/page.tsx app/dashboard/student/live-quiz/[code]/page.tsx

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/teacher/live-quiz/page.tsx app/dashboard/student/live-quiz/[code]/page.tsx
          git diff --cached --quiet || git commit -m "fix live quiz answer shapes and join link"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-live-quiz-shapes-link.yml || true
          git commit -m "remove temporary live quiz UI workflow" || true
          git push || true

name: Fix live quiz skip and reveal controls
on:
  push:
    paths:
      - '.github/workflows/fix-live-quiz-skip-reveal.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/teacher/live-quiz/page.tsx')
          s=p.read_text()
          old="async function skipQuestion(){if(!quiz)return;await intermission()}"
          new="async function skipQuestion(){if(!quiz)return;const n=quiz.current_question+1;if(n>=questions.length){await endQuiz();return}await beginReveal(n)}"
          if old not in s:
              raise SystemExit('skipQuestion target not found')
          s=s.replace(old,new,1)
          old2="<Button variant=\"outline\" onClick={()=>void showResults()} disabled={!isAnswering&&!isReveal}><Eye className=\"mr-2 size-4\"/>Reveal</Button>"
          new2="{isAnswering&&<Button variant=\"outline\" onClick={()=>void showResults()}><Eye className=\"mr-2 size-4\"/>Reveal</Button>}"
          if old2 not in s:
              raise SystemExit('Reveal button target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/teacher/live-quiz/page.tsx
          git diff --cached --quiet || git commit -m 'Fix live quiz skip and reveal controls'
          git push
          rm -f .github/workflows/fix-live-quiz-skip-reveal.yml
          git add .github/workflows/fix-live-quiz-skip-reveal.yml
          git diff --cached --quiet || git commit -m 'Remove temporary live quiz fix workflow'
          git push
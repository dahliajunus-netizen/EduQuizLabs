name: Fix live quiz status pill position
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-live-quiz-status-pill-position.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move status pills down
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/teacher/live-quiz/page.tsx')
          s=p.read_text()
          s=s.replace('className="translate-y-2 rounded-full', 'className="translate-y-5 rounded-full')
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/teacher/live-quiz/page.tsx
          git diff --cached --quiet || git commit -m 'move live quiz status pills down'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-live-quiz-status-pill-position.yml
          git commit -m 'remove temporary live quiz fix workflow'
          git push

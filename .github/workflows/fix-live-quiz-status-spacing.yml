name: Fix live quiz status spacing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-quiz-status-spacing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/teacher/live-quiz/page.tsx')
          s=p.read_text()
          # Put the live status pill in normal document flow with generous bottom spacing,
          # rather than relying on translate-y positioning that can overlap the question.
          replacements = {
            'translate-y-10 rounded-full': 'mb-6 rounded-full',
            'translate-y-5 rounded-full': 'mb-6 rounded-full',
            'translate-y-2 rounded-full': 'mb-6 rounded-full',
          }
          old=s
          for a,b in replacements.items(): s=s.replace(a,b)
          if s==old:
            print('No matching status positioning class found; searching status container directly')
            import re
            for label in ('Question reveal','Answering now','Results'):
              pos=s.find(label)
              if pos<0: continue
              start=s.rfind('className="',0,pos)
              if start>=0:
                end=s.find('"',start+11)
                if end>=0:
                  cls=s[start+11:end]
                  if 'rounded-full' in cls and 'mb-6' not in cls:
                    cls=re.sub(r'\btranslate-y-\S+\b','',cls)
                    cls=' '.join(cls.split())+' mb-6'
                    s=s[:start+11]+cls+s[end:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/dashboard/teacher/live-quiz/page.tsx
          git diff --cached --quiet || git commit -m 'Fix live quiz status spacing'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-live-quiz-status-spacing.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary spacing workflow'
          git push
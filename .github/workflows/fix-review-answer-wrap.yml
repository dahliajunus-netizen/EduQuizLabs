name: Fix review answer wrapping

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/dashboard/student/classes/[code]/tests/page.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('className="mt-1 text-sm font-bold"><span className="mr-2 font-black">{userAnswer}.</span>{choices.find(([letter])=>letter===userAnswer)?.[1]||\'Answer unavailable\'}', 'className="mt-1 min-w-0 whitespace-normal break-words [overflow-wrap:anywhere] text-sm font-bold"><span className="mr-2 font-black">{userAnswer}.</span><span className="whitespace-normal break-words [overflow-wrap:anywhere]">{choices.find(([letter])=>letter===userAnswer)?.[1]||\'Answer unavailable\'}</span>')
          s = s.replace('className="mt-1 text-sm font-bold"><span className="mr-2 font-black">{q.correct_answer}.</span>{choices.find(([letter])=>letter===q.correct_answer)?.[1]||\'Answer unavailable\'}', 'className="mt-1 min-w-0 whitespace-normal break-words [overflow-wrap:anywhere] text-sm font-bold"><span className="mr-2 font-black">{q.correct_answer}.</span><span className="whitespace-normal break-words [overflow-wrap:anywhere]">{choices.find(([letter])=>letter===q.correct_answer)?.[1]||\'Answer unavailable\'}</span>')
          s = s.replace('className={`rounded-xl border p-3 text-sm ${letter===q.correct_answer?', 'className={`min-w-0 rounded-xl border p-3 text-sm whitespace-normal break-words [overflow-wrap:anywhere] ${letter===q.correct_answer?')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/dashboard/student/classes/[code]/tests/page.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix full answer text in test review'
          git push

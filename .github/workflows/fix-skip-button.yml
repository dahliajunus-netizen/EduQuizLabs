name: Fix live quiz skip button
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch skip button
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/dashboard/teacher/live-quiz/page.tsx')
          s=p.read_text()
          matches=list(re.finditer(r'<Button(?=[^>]*onClick=\{skipQuestion\})[^>]*>',s,re.S))
          if not matches:
              raise SystemExit('Skip button not found')
          for m in reversed(matches):
              tag=m.group(0)
              tag=re.sub(r'\sdisabled=\{[^}]*\}', '', tag)
              if 'type=' not in tag:
                  tag=tag[:-1]+' type="button">'
              if 'pointer-events-auto' not in tag:
                  tag=tag[:-1]+' className="relative z-[9999] pointer-events-auto" >'
              s=s[:m.start()]+tag+s[m.end():]
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/dashboard/teacher/live-quiz/page.tsx
          git diff --cached --quiet || git commit -m "fix live quiz skip button clickability"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-skip-button.yml
          git commit -m "remove temporary skip button workflow"
          git push
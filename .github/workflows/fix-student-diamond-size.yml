name: Fix student diamond size
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-student-diamond-size.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch student diamond
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/student/live-quiz/[code]/page.tsx')
          s=p.read_text()
          old="const base=type==='diamond'?'size-14 sm:size-20':'size-20 sm:size-28'"
          new="const base=type==='diamond'?'size-16 sm:size-22':'size-20 sm:size-28'"
          if old not in s:
              raise SystemExit('student diamond size pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/student/live-quiz/'[code]'/page.tsx
          git commit -m 'match student live quiz diamond size' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-student-diamond-size.yml || true
          git commit -m 'remove temporary diamond fix workflow' || true
          git push || true

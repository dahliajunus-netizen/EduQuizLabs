name: Fix assessment submit confirmation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch submit flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/dashboard/student/tests/[id]/page.tsx')
          s = p.read_text()

          if "{submitting?'Submitting…':'Confirm submission'}" in s:
              s = s.replace("{submitting?'Submitting…':'Confirm submission'}", "{submitting?'Submitting…':'Confirm Assessment'}")

          pattern = r':confirm\?<Button[\s\S]*?Review submission</Button>:<Button className="h-11 rounded-xl bg-blue-600 px-5 hover:bg-blue-700" onClick=\{\(\)=>void submit\(false\)\} disabled=\{submitting\}>Submit assessment</Button>'
          replacement = ':<Button className="h-11 rounded-xl bg-blue-600 px-5 hover:bg-blue-700" onClick={()=>void submit(false)} disabled={submitting||confirm}>Submit Assessment</Button>'
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected footer submit block not found; replacements={n}')
          p.write_text(s2)
          PY

      - name: Commit patch and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/dashboard/student/tests/[id]/page.tsx'
          git rm .github/workflows/fix-submit-confirm.yml .github/workflows/fix-submit-confirm-2.yml SUBMIT_CONFIRM_TRIGGER.txt SUBMIT_CONFIRM_TRIGGER_2.txt
          git commit -m "Fix assessment submit confirmation state"
          git push

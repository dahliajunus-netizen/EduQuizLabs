name: Fix assessment submit confirmation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch submit flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/student/tests/[id]/page.tsx')
          s = p.read_text()

          old = "if(!auto){if(questions.some(q=>!answered(q,answersRef.current))){setError('Please answer every question before submitting.');setConfirm(false);return}if(!confirm){setConfirm(true);return}}"
          new = "if(!auto){if(questions.some(q=>!answered(q,answersRef.current))){setError('Please answer every question before submitting.');setConfirm(false);return}if(!confirm){setConfirm(true);return}}"
          if old not in s:
              raise SystemExit('Expected submit validation block not found')

          s = s.replace("{submitting?'Submitting…':'Confirm submission'}", "{submitting?'Submitting…':'Confirm Assessment'}")

          old_footer = ":confirm?<Button variant=\"outline\" className=\"h-11 rounded-xl border-amber-300 bg-amber-50 px-5 text-amber-800 hover:bg-amber-100\" onClick={()=>setConfirm(true)}>Review submission</Button>:<Button className=\"h-11 rounded-xl bg-blue-600 px-5 hover:bg-blue-700\" onClick={()=>void submit(false)} disabled={submitting}>Submit assessment</Button>"
          new_footer = ":<Button className=\"h-11 rounded-xl bg-blue-600 px-5 hover:bg-blue-700\" onClick={()=>void submit(false)} disabled={submitting||confirm}>Submit Assessment</Button>"
          if old_footer not in s:
              raise SystemExit('Expected footer submit block not found')
          s = s.replace(old_footer, new_footer)

          p.write_text(s)
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/dashboard/student/tests/[id]/page.tsx'
          git rm .github/workflows/fix-submit-confirm.yml
          git commit -m "Fix assessment submit confirmation state"
          git push

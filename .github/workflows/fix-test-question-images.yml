name: Fix Test Question Images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Gemini moderation and nickname checker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Remove the Gemini nickname moderation API.
          nickname = Path('app/api/moderate-nickname/route.ts')
          if nickname.exists():
              nickname.unlink()

          # Remove the remaining Gemini material-link checker from the class page.
          p = Path('app/dashboard/student/classes/[code]/page.tsx')
          s = p.read_text()
          s = s.replace("  const [linkCheckStatus, setLinkCheckStatus] = useState<'idle' | 'checking' | 'safe' | 'unsafe' | 'error'>('idle');\n", '')
          s = s.replace("  const [linkCheckReason, setLinkCheckReason] = useState('');\n", '')

          start = "  async function checkMaterialLink(value: string) {"
          if start in s:
              a = s.index(start)
              b = s.index("\n  async function addItem", a)
              s = s[:a] + s[b:]

          s = s.replace(" if (!(await checkMaterialLink(materialLink))) return;", '')
          s = s.replace(" setLinkCheckStatus('idle'); setLinkCheckReason('');", '')
          s = s.replace("setLinkCheckStatus('idle'); ", '')
          s = s.replace("setLinkCheckReason(''); ", '')
          s = s.replace("setLinkCheckStatus('idle')", '')
          s = s.replace("setLinkCheckReason('')", '')

          old_ui = '''{addType === 'material' ? <><Input placeholder=\"Material name\" value={materialName} onChange={e => { setMaterialName(e.target.value); setLinkCheckStatus('idle'); }} required /><Input type=\"url\" placeholder=\"https://...\" value={materialLink} onChange={e => { setMaterialLink(e.target.value); setLinkCheckStatus('idle'); setLinkCheckReason(''); }} required />{materialLink && validUrl(materialLink) && <div className=\"rounded-md border bg-muted/30 p-3 text-sm\">{linkCheckStatus === 'idle' && <span className=\"text-muted-foreground\">Gemini Link Safety will automatically check this link when you press Add.</span>}{linkCheckStatus === 'checking' && <span>Gemini is checking this link...</span>}{linkCheckStatus === 'safe' && <span className=\"text-green-600\">✓ {linkCheckReason}</span>}{(linkCheckStatus === 'unsafe' || linkCheckStatus === 'error') && <span className=\"text-red-600\">✕ {linkCheckReason}</span>}</div>}</> :'''
          new_ui = '''{addType === 'material' ? <><Input placeholder=\"Material name\" value={materialName} onChange={e => setMaterialName(e.target.value)} required /><Input type=\"url\" placeholder=\"https://...\" value={materialLink} onChange={e => setMaterialLink(e.target.value)} required /> :'''
          if old_ui in s:
              s = s.replace(old_ui, new_ui, 1)
          p.write_text(s)

          # Keep the existing test-question image fixes.
          p = Path('app/dashboard/student/classes/[code]/components/QuestionModal.tsx')
          s = p.read_text()
          old = '''        const currentImage = imageDataUrl.trim() || imageUrl.trim();\n        if (currentImage) parsed.image_url = currentImage;\n        else delete parsed.image_url;\n\n        return originalFetch(input, { ...init, body: JSON.stringify(parsed) });'''
          new = '''        const currentImage = imageDataUrl.trim() || imageUrl.trim();\n        if (currentImage) {\n          const existingAnswerData = parsed.answer_data && typeof parsed.answer_data === 'object' && !Array.isArray(parsed.answer_data)\n            ? parsed.answer_data as Record<string, unknown>\n            : {};\n          parsed.answer_data = { ...existingAnswerData, image_url: currentImage };\n        } else if (parsed.answer_data && typeof parsed.answer_data === 'object' && !Array.isArray(parsed.answer_data)) {\n          const existingAnswerData = parsed.answer_data as Record<string, unknown>;\n          const nextAnswerData = { ...existingAnswerData };\n          delete nextAnswerData.image_url;\n          parsed.answer_data = nextAnswerData;\n        }\n        delete parsed.image_url;\n\n        return originalFetch(input, { ...init, body: JSON.stringify(parsed) });'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-test-question-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'remove Gemini moderation features'
          git push

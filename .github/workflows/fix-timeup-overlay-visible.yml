name: Fix student time up overlay visibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-timeup-overlay-visible.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible time up overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/student/live-quiz/[code]/page.tsx')
          s=p.read_text()
          overlay='''{timeUp&&answering&&q&&!answered&&<div className="pointer-events-none fixed inset-0 z-[9999] flex items-center justify-center bg-red-950/20 px-4 backdrop-blur-[2px]" role="alert"><div className="w-full max-w-sm rounded-3xl border-2 border-red-500/30 bg-card p-8 text-center shadow-2xl"><div className="mx-auto mb-4 flex size-20 items-center justify-center rounded-full bg-red-500/15 text-red-600 animate-pulse"><Clock className="size-10"/></div><h2 className="text-3xl font-black tracking-tight text-red-600">TIME’S UP!</h2><p className="mt-2 text-sm font-medium text-muted-foreground">No answer selected</p></div></div>}'''
          # Remove any previous copies so this fix is idempotent.
          import re
          s=re.sub(r'\{timeUp&&answering&&q&&!answered&&<div className="pointer-events-none fixed inset-0 z-\[9999\].*?</div>\}', '', s, flags=re.S)
          # Put the overlay immediately before the final main closing tag, so it is
          # inside the active quiz screen rather than an unreachable error branch.
          pos=s.rfind('</main>')
          if pos < 0:
            raise SystemExit('Could not find final main closing tag')
          s=s[:pos]+overlay+s[pos:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'app/dashboard/student/live-quiz/[code]/page.tsx'
          git diff --cached --quiet || git commit -m 'Fix student time up overlay visibility'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-timeup-overlay-visible.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary time up workflow'
          git push
name: One-time Live Quiz UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide student reveal question
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/student/live-quiz/[code]/page.tsx')
          s=p.read_text()
          old='<h1 className="mt-3 text-4xl font-black leading-tight tracking-tight sm:text-6xl">{currentQ.question}</h1>'
          new='<div className="mt-3 text-4xl font-black leading-tight tracking-tight sm:text-6xl">Get ready!</div>'
          if old not in s:
              raise SystemExit('Target question heading not found; no changes made.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/hide-student-live-question.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/student/live-quiz/[code]/page.tsx .github/workflows/hide-student-live-question.yml
          git commit -m "fix: hide question during student live quiz reveal"
          git push

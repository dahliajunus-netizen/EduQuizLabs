name: Inspect live quiz skip button
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print skip markup
        run: |
          grep -n -i -C 8 'skip' app/dashboard/teacher/live-quiz/page.tsx || true

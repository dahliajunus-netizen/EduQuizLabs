name: Apply Live Quiz final patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-quiz-final-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch teacher UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/teacher/live-quiz/page.tsx')
          s=p.read_text()
          old="const connectedPlayers = [...players].sort((x,y) => x.nickname.localeCompare(y.nickname)); const rankedPlayers = [...players].sort((x,y) => y.score !== x.score ? y.score-x.score : x.total_response_time_ms !== y.total_response_time_ms ? x.total_response_time_ms-y.total_response_time_ms : y.correct_answers-x.correct_answers);"
          new="const connectedPlayers = [...players].sort((x,y) => x.nickname.localeCompare(y.nickname)); const rankedPlayers = [...players].sort((x,y) => y.correct_answers !== x.correct_answers ? y.correct_answers-x.correct_answers : x.total_response_time_ms !== y.total_response_time_ms ? x.total_response_time_ms-y.total_response_time_ms : y.score-x.score);"
          if old in s: s=s.replace(old,new,1)
          old='<div className="flex items-center gap-3"><span className="flex size-8 items-center justify-center rounded-lg bg-muted text-xs font-black">{i+1}</span><span className="min-w-0 flex-1 truncate font-bold">{p.nickname}</span><span className="text-sm font-black">{p.score.toLocaleString()}</span></div><div className="mt-2 flex items-center justify-between pl-11 text-[11px] font-semibold text-muted-foreground"><span>{p.correct_answers} correct</span><span>{formatResponseTime(p.total_response_time_ms)}</span></div>'
          new='<div className="flex items-center gap-3"><span className="flex size-8 items-center justify-center rounded-lg bg-muted text-xs font-black">{i+1}</span><span className="min-w-0 flex-1 truncate font-bold">{p.nickname}</span></div><div className="mt-2 flex items-center justify-between pl-11 text-[11px] font-semibold text-muted-foreground"><span>{p.correct_answers} correct</span><span>{formatResponseTime(p.total_response_time_ms)}</span></div>'
          if old in s: s=s.replace(old,new,1)
          old='<span className="flex-1 font-bold">{p.nickname}</span><span className="font-black">{formatResponseTime(p.total_response_time_ms)}</span>'
          new='<span className="flex-1 font-bold">{p.nickname}</span><div className="flex items-center gap-4 text-right"><div><p className="text-[10px] font-bold uppercase tracking-wider text-muted-foreground">Correct</p><p className="font-black">{p.correct_answers}</p></div><div><p className="text-[10px] font-bold uppercase tracking-wider text-muted-foreground">Time</p><p className="font-black tabular-nums">{formatResponseTime(p.total_response_time_ms)}</p></div></div>'
          if old in s: s=s.replace(old,new,1)
          if 'async function endQuizNow()' not in s:
            marker='async function copyCode()'
            fn='''async function endQuizNow() {\n    if (!quiz) return;\n    if (!window.confirm('End this live quiz now? Players will see the final leaderboard.')) return;\n    try {\n      const rows = await api(`live_quizzes?id=eq.${encodeURIComponent(quiz.id)}`, { method: 'PATCH', headers: { ...h, Prefer: 'return=representation' }, body: JSON.stringify({ status: 'finished', question_started_at: null }) });\n      setQuiz(rows?.[0] || { ...quiz, status: 'finished', question_started_at: null });\n      setAnsweredCount(0);\n    } catch (e) { setError(e instanceof Error ? e.message : 'Could not end the quiz.'); }\n  }\n  '''+marker
            if marker in s: s=s.replace(marker,fn,1)
          old='<div className="mt-6 flex items-center justify-between gap-3"><p className="text-sm font-bold text-muted-foreground">Students are answering on their devices.</p><Button className="rounded-xl" onClick={finishOrNext}>{current + 1 >= questions.length ? \'Finish Quiz\' : \'Next Question\'}<ChevronRight className="ml-2 size-4" /></Button></div>'
          new='<div className="mt-6 flex items-center justify-between gap-3"><p className="text-sm font-bold text-muted-foreground">Students are answering on their devices.</p><div className="flex items-center gap-2"><Button variant="destructive" className="rounded-xl" onClick={endQuizNow}>End Quiz</Button><Button className="rounded-xl" onClick={finishOrNext}>{current + 1 >= questions.length ? \'Finish Quiz\' : \'Next Question\'}<ChevronRight className="ml-2 size-4" /></Button></div></div>'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/teacher/live-quiz/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: teacher live quiz leaderboard and end quiz'
          git push origin main
name: Enlarge live quiz student answers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-quiz-student-answer-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Enlarge answer grid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/student/live-quiz/[code]/page.tsx')
          s=p.read_text()
          # Make the answer area dominate the viewport while preserving the existing 2x2 layout.
          replacements = {
            'grid grid-cols-2 gap-3 sm:gap-4': 'grid grid-cols-2 gap-4 sm:gap-5 min-h-[52vh] sm:min-h-[58vh]',
            'min-h-[52vh] sm:min-h-[58vh]': 'min-h-[52vh] sm:min-h-[58vh]',
          }
          for old,new in replacements.items():
            s=s.replace(old,new)
          # Increase common answer-card sizing if present.
          s=s.replace('min-h-[150px]', 'min-h-[24vh]')
          s=s.replace('min-h-[140px]', 'min-h-[24vh]')
          s=s.replace('min-h-[120px]', 'min-h-[22vh]')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/dashboard/student/live-quiz/[code]/page.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: enlarge student live quiz answer buttons'
          git push origin main

          replacements.append(("""disabled={busy}
                  >
                    {busy ? (
                      <Loader2 className=\"size-4 animate-spin\" />
                    ) : (
                      'Submit'
                    )}""", """disabled={busy || linkCheck.status === 'checking'}
                  >
                    {busy || linkCheck.status === 'checking' ? (
                      <Loader2 className=\"size-4 animate-spin\" />
                    ) : (
                      'Submit'
                    )}"""))

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected code block not found; aborting without changes.')
              s = s.replace(old, new, 1)

          p.write_text(s)
          print('Patched class page with Gemini link safety checks.')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/dashboard/student/classes/[code]/page.tsx'
          git commit -m 'fix: restore Gemini link safety checks' || exit 0

name: Patch Gemini Link Checker

on:
  push:
    branches:
      - 'v0/dahliajunus-3851-8e914645-2'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch class page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/student/classes/[code]/page.tsx')
          s = p.read_text()
          if 'async function checkLinkSafety' in s:
              print('Gemini checker already patched; nothing to do.')
              raise SystemExit(0)

          replacements = []

          replacements.append(("""  const [gradeInputs, setGradeInputs] =
    useState<Record<string, string>>({});

  /* ---------------- HTTP HELPERS ---------------- */""", """  const [gradeInputs, setGradeInputs] =
    useState<Record<string, string>>({});

  /* ---------------- GEMINI LINK SAFETY ---------------- */

  const [linkCheck, setLinkCheck] = useState<{
    status: 'idle' | 'checking' | 'safe' | 'unsafe';
    reason: string;
  }>({ status: 'idle', reason: '' });

  async function checkLinkSafety(link: string) {
    const trimmed = link.trim();

    if (!validUrl(trimmed)) {
      setLinkCheck({
        status: 'unsafe',
        reason: 'Please enter a valid HTTP or HTTPS link.',
      });
      return false;
    }

    setLinkCheck({ status: 'checking', reason: '' });

    try {
      const response = await fetch('/api/moderate-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: trimmed }),
      });

      const result = await response.json().catch(() => null);

      if (!response.ok || result?.safe !== true) {
        const reason =
          result?.reason ||
          'This link could not be approved for use on EduQuizLabs.';

        setLinkCheck({ status: 'unsafe', reason });
        return false;
      }

      setLinkCheck({
        status: 'safe',
        reason: result.reason || 'Link passed the safety check.',
      });

      return true;
    } catch {
      setLinkCheck({
        status: 'unsafe',
        reason: 'The link safety checker is unavailable. Please try again.',
      });
      return false;
    }
  }

  function resetLinkCheck() {
    setLinkCheck({ status: 'idle', reason: '' });
  }

  /* ---------------- HTTP HELPERS ---------------- */"""))

          replacements.append(("""      if (addType === 'material') {
        if (
          !materialName.trim() ||
          !validUrl(materialLink)
        ) {
          throw new Error(
            'Enter a valid material name and link.'
          );
        }

        const response = await fetch(""", """      if (addType === 'material') {
        if (
          !materialName.trim() ||
          !validUrl(materialLink)
        ) {
          throw new Error(
            'Enter a valid material name and link.'
          );
        }

        const safe = await checkLinkSafety(materialLink);
        if (!safe) {
          return;
        }

        const response = await fetch("""))

          replacements.append(("""      setAddModal(false);
      setMaterialName('');
      setMaterialLink('');""", """      setAddModal(false);
      setMaterialName('');
      setMaterialLink('');
      resetLinkCheck();"""))

          replacements.append(("""    if (
      !selectedAssignment?.id ||
      !studentId ||
      !submissionClass ||
      !validUrl(submissionLink)
    ) {
      return;
    }

    setBusy(true);""", """    if (
      !selectedAssignment?.id ||

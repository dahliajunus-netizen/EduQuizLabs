      !submissionClass ||
      !validUrl(submissionLink)
    ) {
      return;
    }

    const safe = await checkLinkSafety(submissionLink);
    if (!safe) {
      return;
    }

    setBusy(true);"""))

          replacements.append(("""      setSubmissionModal(false);

      await load();""", """      setSubmissionModal(false);
      resetLinkCheck();

      await load();"""))

          replacements.append(("""                    <Input
                      type=\"url\"
                      placeholder=\"https://...\"
                      value={materialLink}
                      onChange={e =>
                        setMaterialLink(
                          e.target.value
                        )
                      }
                      required
                    />
                  </>""", """                    <Input
                      type=\"url\"
                      placeholder=\"https://...\"
                      value={materialLink}
                      onChange={e => {
                        setMaterialLink(e.target.value);
                        resetLinkCheck();
                      }}
                      required
                    />

                    {linkCheck.status !== 'idle' && (
                      <div
                        className={`rounded-md border p-3 text-sm ${
                          linkCheck.status === 'checking'
                            ? 'border-border bg-muted/30'
                            : linkCheck.status === 'safe'
                              ? 'border-green-500/30 bg-green-500/10'
                              : 'border-destructive/30 bg-destructive/10'
                        }`}
                      >
                        {linkCheck.status === 'checking' ? (
                          <span className=\"flex items-center gap-2\">
                            <Loader2 className=\"size-4 animate-spin\" />
                            Gemini is checking this link...
                          </span>
                        ) : (
                          <span>
                            <b>
                              {linkCheck.status === 'safe'
                                ? 'Link approved'
                                : 'Link blocked'}
                            </b>
                            {linkCheck.reason && (
                              <span className=\"ml-1\">
                                — {linkCheck.reason}
                              </span>
                            )}
                          </span>
                        )}
                      </div>
                    )}
                  </>"""))

          replacements.append(("""                  <Input
                    type=\"url\"
                    placeholder=\"Submission link\"
                    value={submissionLink}
                    onChange={e =>
                      setSubmissionLink(
                        e.target.value
                      )
                    }
                    required
                  />

                  <div className=\"flex gap-2\">""", """                  <Input
                    type=\"url\"

name: Repair live quiz skip button
on:
  push:
    branches: [main]
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair button markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/dashboard/teacher/live-quiz/page.tsx')
          s=p.read_text()
          pat=re.compile(r'<Button(?=[^>]*onClick=\{skipQuestion\})[^>]*>',re.S)
          ms=list(pat.finditer(s))
          if not ms:
              raise SystemExit('Skip button not found')
          for m in reversed(ms):
              tag=m.group(0)
              tag=re.sub(r'\sdisabled=\{[^}]*\}', '', tag)
              classes=[]
              def grab(mm):
                  classes.append(mm.group(2)); return ''
              tag=re.sub(r'\sclassName=("|\')([^"\']*)\1', grab, tag)
              cls=(classes[0] if classes else '')
              needed='relative z-[9999] pointer-events-auto touch-manipulation'
              cls=' '.join(dict.fromkeys((cls+' '+needed).split()))
              tag=tag[:-1] + f' className="{cls}">' if not tag.rstrip().endswith('>') else tag
              s=s[:m.start()]+tag+s[m.end():]
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/dashboard/teacher/live-quiz/page.tsx
          git diff --cached --quiet || git commit -m "repair live quiz skip button"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/repair-skip-button.yml
          git commit -m "remove temporary skip repair workflow"
          git push